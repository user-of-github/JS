services:
  db: 
    container_name: postgres
    restart: always
    image: postgres:18-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - TZ=GMT
      - PGTZ=GMT
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    restart: always
    ports:
      - "${PG_ADMIN_OUTPUT_PORT}:${PG_ADMIN_INNER_PORT}"
    networks:
      - backend
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_DEFAULT_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PG_ADMIN_INNER_PORT}

  redis:
    container_name: redis
    image: redis:8.4-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis-data:/data
    env_file:
      - ./.env
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - backend

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    ports:
      - "${REDIS_INSIGHT_APP_PORT}:${REDIS_INSIGHT_APP_PORT}"
    environment:
      - RI_APP_PORT=${REDIS_INSIGHT_APP_PORT}
      - RI_APP_HOST=${REDIS_INSIGHT_APP_HOST}
      - RI_LOG_LEVEL=${REDIS_INSIGHT_LOG_LEVEL}
      - RI_STDOUT_LOGGER=${REDIS_INSIGHT_STDOUT_LOGGER}
      - RI_FILES_LOGGER=${REDIS_INSIGHT_FILES_LOGGER}
      - RITRUSTEDORIGINS=${REDIS_INSIGHT_TRUSTED_ORIGINS}
      - RI_PROXY_PATH=${REDIS_INSIGHT_PROXY_PATH}
    networks:
      - backend
 

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:

networks:
  backend: