version: '3.8'

services:
  main:
    container_name: main
    build:
      context: .
    env_file:
      - ./.env.development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 4200:4200
      - 9229:9229
    command: npm run start:dev
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: postgres
    env_file:
      - ./.env.development
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
